services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: om_cmms
      POSTGRES_USER: om_cmms
      POSTGRES_PASSWORD: om_cmms_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - om_cmms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U om_cmms -d om_cmms"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  om_cmms_postgres:
