# Render Blueprint: Web-Zugriff auf den Pilot mit PostgreSQL.
# Einrichtung: https://render.com/deploy?repo=https://github.com/w6p9jk84gk-debug/OM_CMMS_Ticketing
services:
  - type: web
    name: om-cmms-ticketing
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    # Migration und Seed sind idempotent und laufen bei jedem Start.
    startCommand: npm run db:migrate && npm run db:seed && npx next start --hostname 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: om-cmms-db
          property: connectionString

databases:
  - name: om-cmms-db
    plan: free
    region: frankfurt
    databaseName: om_cmms
    user: om_cmms
    postgresMajorVersion: "17"
